name: Feature Request
description: Suggest an idea or enhancement for GitHub Stats.
title: "[Feature]: "
labels: ["enhancement"]
assignees:
  - abhiaryain

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature!
        We welcome ideas that improve usability, performance, or developer experience.

        > ⚠️ **Security notice:**
        > If your request relates to a security issue, please do **not** submit it here.
        > Follow our [Security Policy](https://github.com/abhiaryain/github-stats/blob/main/.github/SECURITY.md).

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Describe the problem this feature would solve.
      placeholder: I'm frustrated when ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you’d like to see implemented.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you’ve considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots related to the feature request.
    validations:
      required: false
